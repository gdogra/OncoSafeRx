# Curated drug-drug interactions - SINGLE SOURCE OF TRUTH.
# Edit this file, then run: npm run build:ddi  (regenerates src/data/knownInteractions.js)
# Validated by schemas/ddi_curated.schema.json. One row per unordered drug pair.
# Fields: drug_primary, drug_interactor, severity, mechanism, effect, recommendation,
#         evidence_level (high|moderate|low|unknown), evidence_source | sources[], citations[], rxcui[]
# CITATIONS: scripts/cite_ddi.mjs attaches verbatim FDA-label snippets (citation_status: label_mention =
# the label of one drug discusses the other; it does NOT confirm our severity grade). Entries marked
# unverified have no checkable source yet; their `sources` text is a legacy summary only.
# Population, genotype, condition and food warnings are NOT drug pairs; they live in data/non_ddi_warnings.yaml.

